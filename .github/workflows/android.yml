# CI for LexiLearn: analyze, test, and build the release Android App Bundle on
# every push and every pull request.
#
# The pin below is not a guess. Every check in this repository was developed and
# verified against exactly this build, and this is the `flutter --version`
# output taken on the machine that ran them:
#
#   Flutter 3.44.6 • channel stable • https://github.com/flutter/flutter.git
#   Framework • revision ee80f08bbf (3 months ago) • 2026-07-08 15:02:06 -0700
#   Engine • hash d3a3293399556a85388faf8c6f0723a7a5597aa8 (revision 83675ed276) • 2026-06-30 16:59:03.000Z
#   Tools • Dart 3.12.2 • DevTools 2.57.0
#
# So it is PINNED, not "stable". `flutter-version: stable` resolves to whatever
# ships on the day CI runs, and a green local suite next to a red CI would then
# mean a different compiler, not a different commit.
#
# `java-version: '17'` is pinned for exactly the same reason. The local Android
# builds run on Temurin 17.0.19+10 (openjdk 17.0.19 2026-04-21), which is what
# `flutter config --list` reports as `jdk-dir`. The PATH `java` on that machine is
# a different JDK entirely (20.0.1), so the pin is not a restatement of PATH.
name: android

on:
  # Every push, not just pushes to main: a red suite is worth knowing about
  # while the branch that caused it is still in progress.
  push:
  pull_request:
  workflow_dispatch:

# A public repository. This workflow only ever reads the tree and uploads a
# build artefact; it needs no write scope to the repository.
permissions:
  contents: read

# §13 of docs/engineering-standards.md exists because this project hangs four
# different ways. A wall-clock deadline on the job catches all four; GitHub's
# default is 360 minutes, which is long enough that a hung Gradle daemon looks
# like "CI is just slow" for six hours.
jobs:
  verify:
    name: analyze, test, bundle
    # PINNED, not `ubuntu-latest`, for the same reason the Flutter and Java
    # versions are pinned. The first run of this workflow reported
    # "Image: ubuntu-24.04", and the run that verified it carried this warning:
    #
    #   The ubuntu-latest label will migrate to Ubuntu 26 beginning
    #   October 19, 2026.
    #
    # So `ubuntu-latest` is a moving target with a migration date, and a new OS
    # means a different preinstalled Android SDK, NDK and JDK -- exactly the
    # class of silent drift the Flutter pin exists to stop. `ubuntu-24.04` is
    # the image this workflow was actually verified against, so the label only
    # moves when someone deliberately moves it.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # PINNED -- see the header. Do not change this to `stable`.
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      # v5, not v4: the run that verified this workflow printed
      # "setup-java v4 is deprecated and will no longer receive updates.
      #  Please migrate to actions/setup-java@v5." v4 was working; it has simply
      # been retired, and there is no reason to keep a step on a dead major.
      #
      # Placed after flutter-action deliberately: setup-java writes JAVA_HOME
      # to the environment last, so Gradle is guaranteed to run on Temurin 17
      # rather than on whatever JDK flutter-action happened to set up.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK command-line tools, and the platform the module compiles
      # against (compileSdk = 36, Flutter 3.44.6's default).
      #
      # This step is NOT optional, and its absence is the exact wall Task 16 hit:
      # `flutter build appbundle --release` runs a post-build check after Gradle
      # has already succeeded -- gradle.dart:601-611 calls
      # `_isAabStrippedOfDebugSymbols`, which shells out to `apkanalyzer` from
      # the command-line tools. `AndroidSdk.cmdlineToolsAvailable` is a bare
      # check that the `cmdline-tools` directory exists; when it does not, the
      # check returns false and the build exits 1 *after* producing a perfectly
      # good bundle. On the Task 16 machine
      # %LOCALAPPDATA%\Android\Sdk\cmdline-tools was empty and the bundle step
      # exited 1 for that reason alone.
      #
      # The action used is `android-actions/setup-android@v3`. It installs
      # command-line tools revision 12266719 into
      # $ANDROID_HOME/cmdline-tools/12266719 -- a version-named directory, which
      # is the second layout `AndroidSdk.getCmdlineToolsPath` tries when there is
      # no `latest` one -- and it runs `sdkmanager --licenses`, which is what
      # lets the Android Gradle Plugin install the NDK itself instead of the
      # build failing for want of it. It did, on the run that verified this file:
      # "Install NDK (Side by side) 28.2.13676358 v.28.2.13676358" complete,
      # then the same for CMake 3.22.1.
      #
      # Build-tools is deliberately NOT named here. The AGP version in
      # android/settings.gradle.kts decides which revision it wants, the
      # ubuntu-24.04 image already ships the one it wants -- no build-tools line
      # appears anywhere in the verified run -- and naming a revision AGP 9 does
      # not use is a way to fail this step for no reason.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Cache pub and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}

      - run: flutter pub get

      - run: flutter analyze

      # The golden tests in test/goldens/golden_test.dart are `skip:`-ed and that
      # is DELIBERATE -- do not "fix" them by removing the skip.
      #
      # Two reasons, both measured: the font rasteriser differs per platform (the
      # committed PNGs were rendered on Windows with Segoe UI, Linux draws
      # Roboto), and the shots bake a local timestamp from
      # `DateTime.utc(...).toLocal()`, so a UTC runner renders 12:00 where the
      # UTC+3 authoring box rendered 15:00. The images are design-review
      # references; `tool/golden_census.ps1` is the gate that reads their
      # colours rather than their glyphs, and it is not part of CI.
      #
      # Note the second consequence, because it surprises everyone once: a
      # `skip:` also blocks `--update-goldens`. CI can therefore neither produce
      # nor refresh a golden, on purpose. Regenerate them locally and commit the
      # PNG.
      #
      # Expect exactly 9 skips on every run, all from this one file: "home shell
      # user shot", plus a light/dark pair each for stats, favorites, word
      # detail and flashcards. Measured, not counted by eye -- `flutter test
      # --coverage` on the authoring machine ends `+415 ~9: All tests passed!`.
      # They are reported as skipped, not failed.
      - run: flutter test --coverage

      # Builds with NO android/key.properties and NO android/app/*.jks, on
      # purpose. That is the same situation as a fresh clone, and it is what
      # exercises the debug-signing fallback in android/app/build.gradle.kts --
      # the fallback is the only reason this step can be green on a public
      # repository, where the upload key must never exist. Both files are covered
      # by android/.gitignore, so this checkout provably has neither.
      #
      # IF THIS STEP FAILS WITH A SIGNING ERROR, the fix is in
      # android/app/build.gradle.kts, not in this file.
      - run: flutter build appbundle --release

      # `error`, not the default `warn`: a green job that quietly uploaded no
      # bundle would be a lie, and this artefact is the only output of the
      # whole job.
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error