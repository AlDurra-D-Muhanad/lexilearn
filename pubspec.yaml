name: lexilearn
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # provider: ChangeNotifier DI without code generation.
  # sqflite: the only local store that survives app restart.
  # path: builds the database file path.
  # path_provider: app documents directory, where backups are written.
  # file_picker: user picks a .json pack from Downloads or Drive.
  # share_plus: hands a written backup file to the Android share sheet.
  # crypto: SHA-1 for deterministic entry ids.
  # url_launcher: hands an https link to the browser or Telegram. Adds **no
  # permission** - see lib/ui/link/external_link.dart for the manifest it
  # contributes and docs/engineering-standards.md section 12.
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.4+2
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  crypto: ^3.0.7
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/packs/
    # The user's own photographs, shipped as bundled local assets.
    #
    # **No network, no permission, nothing added to the offline guarantee.**
    # `docs/engineering-standards.md` section 12 is unchanged by this line: an
    # asset in the APK is bytes in the APK, and the merged release manifest
    # still carries no INTERNET because nothing here can contribute one.
    #
    # The directory is declared as a whole so adding a photograph is a file drop,
    # not a pubspec edit. `lib/ui/wallpaper/wallpaper_catalog.dart` is what
    # actually names them, and `test/ui/wallpaper_catalog_test.dart` asserts the
    # two lists agree - an asset on disk that no list mentions is a photograph
    # the app can never show, which is the same failure shape as a golden image
    # on disk that `tool/golden_census.ps1` never reads.
    - assets/wallpapers/

  # Tajawal renders every Arabic string; Inter renders every English vocabulary
  # term and numeral. Both are bundled, never fetched, so the app never touches
  # the network to look like itself. See assets/fonts/OFL.txt for the licences.
  # Every asset path below is a static instance with no `fvar` table, which is
  # why `fontWeight` really does change the rendered weight.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Launcher icon.
#
# assets/icon/app_icon.png is a generated 1024x1024 opaque PNG: a gold open book on the
# brand purple (#F59E0B on #885CF6), no rounded corners and no transparency, because
# Android applies the mask itself. The glyph is drawn inside the adaptive-icon safe zone
# (the central 66% of the 108dp canvas), so `adaptive_icon_foreground_inset` is 0 -- the
# package's 16% default would shrink it a further 32% and leave the book looking lost.
#
# `android` MUST stay "ic_launcher": that is what AndroidManifest.xml already points at
# with @mipmap/ic_launcher, and this package does not edit the manifest.
#
# After changing the PNG, re-run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#885CF6"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24
